# from fab0-dev/fab0-examples feature--v0.3.0
# The parent of a composition: a Story of a Feature, specified by its product owner, built by connected factories
# side by side (here a service and its web client, each a copy of the delivery example), and wrapped up from what
# they hand back: follow-up Stories under the same Feature, or the Feature closed. This repository holds no code.
schema: 3
repos:
  # EDIT: this repository, where the Features and their Stories are filed.
  # The organisation and this repository's name are placeholders everywhere in .fab0/, as the README says: the
  # repository's name is the factory's name.
  home: {path: ., github: fab0-dev/sandbox-home, owner: product-owner}
  # EDIT: the runs repository, a sibling checkout, which this factory and every factory it calls share: the
  # requirements, the wrap-up and what the factories hand back are files there, and the tracker's issues of every
  # run.
  runs: {path: ../sandbox-runs, github: fab0-dev/sandbox-runs}
factories:
  # EDIT: one entry per connected factory: its home repository, its checkout beside this one, and the role whose
  # turn it is while its child run works. The pipeline's calls name them.
  service: {github: fab0-dev/sandbox-api, path: ../sandbox-api, owner: service-developer}
  web: {github: fab0-dev/sandbox-web, path: ../sandbox-web, owner: web-developer}
people:
  # EDIT: the GitHub users in each role.
  product-owner: {github: [eugenefurs]}
  service-developer: {github: [eugenefurs]}
  web-developer: {github: [eugenefurs]}
tracker:
  kind: github
  owner: fab0-dev # the same as every connected factory's
  project: 3
  fields: {signal: Waiting on}
git:
  base: main
  branching: run # the parent writes only the runs repository: a run branch there, merged into main at the end
# The run tracker, which every factory it calls shares: each call opens a child Pipeline Run under this run's.
tracking: {kind: github, github: fab0-dev/sandbox-runs}
models:
  claude-code: {deep: opus, balanced: sonnet, fast: haiku}
profiles:
  cheap: {models: {claude-code: {deep: sonnet, balanced: sonnet}}}
pipelines: [story]
